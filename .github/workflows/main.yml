name: Deploy React to S3

on:
  push:
    branches:
      - main  # Trigger this action when changes are pushed to the 'main' branch
  pull_request:
    branches:
      - main  # Trigger this action on PRs targeting the 'main' branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up Node.js (for building React app)
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '22'  # Specify the Node.js version you're using for your React app

    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm install  # Or use 'yarn install' if you're using yarn

    # Step 4: Build the React app
    - name: Build React app
      run: npm run build  # This will create the 'build' directory for your React app

    # Step 5: Set up AWS credentials
    - name: Set up AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # Step 6: Sync the React build folder to S3
    - name: Sync build to S3
      run: |
        aws s3 sync ./dist/ s3://rehan-files/ --delete  # Replace with your S3 bucket name
